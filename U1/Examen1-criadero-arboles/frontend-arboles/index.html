<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Compra de Árboles</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="header">Dashboard de Compra de Árboles</div>

<div class="container">

    <h1>Panel General</h1>

    <!-- CARDS -->
    <div class="cards">
        <div class="card">
            <h3>Precios disponibles</h3>
            <div id="card-precios">Cargando...</div>
        </div>

        <div class="card">
            <h3>Total de árboles ingresados</h3>
            <div id="card-total">0</div>
        </div>

        <div class="card">
            <h3>Total a pagar</h3>
            <div id="card-total-pagar">$0.00</div>
        </div>
    </div>

    <!-- FORM -->
    <div class="card">
        <h3>Ingresar cantidades</h3>

        <div class="form-group">
            <label>Paltos:</label>
            <input type="number" id="paltos" value="100">
        </div>

        <div class="form-group">
            <label>Limones:</label>
            <input type="number" id="limones" value="200">
        </div>

        <div class="form-group">
            <label>Chirimoyos:</label>
            <input type="number" id="chirimoyos" value="300">
        </div>

        <button onclick="calcular()">Calcular</button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <h3>Detalle de Cálculo</h3>
        <table id="tabla-detalle" hidden>
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Cantidad</th>
                    <th>Precio Unit.</th>
                    <th>Descuento</th>
                    <th>Subtotal Neto</th>
                </tr>
            </thead>
            <tbody id="detalle-body">
            </tbody>
        </table>
    </div>

    <h3>JSON Completo</h3>
<div id="resultado" class="result-box">Esperando datos...</div>

<button id="btn-descargar" style="margin-top: 10px;" onclick="descargarJSON()">
    Descargar JSON
</button>


</div>

<script src="js/app.js"></script>
</body>
</html>
