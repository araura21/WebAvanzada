<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Banco Bandido de Peluche - Cálculo Financiero</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- JS -->
  <script defer src="app.js"></script>
</head>

<body>

  <h1>Banco “Bandido de Peluche”</h1>
  <h2>Cálculo Financiero de un Cliente</h2>

  <!-- FORMULARIO -->
  <div class="card">
    <h3>Ingresar Datos</h3>

    <label>Saldo anterior:</label>
    <input id="saldoAnterior" type="number" step="0.01"><br>

    <label>Monto de compras:</label>
    <input id="montoCompras" type="number" step="0.01"><br>

    <label>Pago realizado:</label>
    <input id="pagoRealizado" type="number" step="0.01"><br>

    <button onclick="calcularCliente()">Calcular Cliente</button>
  </div>

  <!-- TABLA DE RESULTADOS -->
  <div class="card">
    <h3>Resultado del Cálculo</h3>

    <table id="resultadoTabla">
      <thead>
        <tr>
          <th>Saldo Anterior</th>
          <th>Compras</th>
          <th>Pago Realizado</th>
          <th>Saldo Base</th>
          <th>Pago Mínimo Base</th>
          <th>¿Es Moroso?</th>
          <th>Interés</th>
          <th>Multa</th>
          <th>Saldo Actual</th>
          <th>Pago Mínimo</th>
          <th>Pago sin Intereses</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="11" style="text-align:center;">Sin datos aún...</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
