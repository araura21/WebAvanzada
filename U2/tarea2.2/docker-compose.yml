services:
  mysql:
    image: mysql:8
    container_name: mysql_sistema
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sis_academico
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./sistema-academico/sis-academico-backend
    container_name: backend_sistema
    env_file:
      - ./sistema-academico/sis-academico-backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      
volumes:
  mysql_data:
