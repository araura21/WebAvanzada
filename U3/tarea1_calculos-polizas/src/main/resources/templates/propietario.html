<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Datos del Propietario</title>
</head>
<body>
    <!-- Fragmento de formulario de propietario -->
    <div th:fragment="form-propietario" class="form-section" id="seccion-propietario">
        <div class="section-header">
            <span class="section-icon"></span>
            <h2>Datos del Propietario</h2>
        </div>
        
        <div class="form-group">
            <label for="nombre">
                <span class="label-icon"></span>
                Nombre Completo
            </label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre completo" required>
            <span class="field-hint">Nombre completo del propietario del vehículo</span>
        </div>
        
        <div class="form-group">
            <label for="edad">
                <span class="label-icon"></span>
                Edad
            </label>
            <input type="number" id="edad" name="edad" min="18" max="120" placeholder="Ej: 25" required>
            <span class="field-hint">Debe ser mayor de 18 años</span>
        </div>
        
        <div class="form-group">
            <label for="accidentes">
                <span class="label-icon"></span>
                Número de Accidentes
            </label>
            <input type="number" id="accidentes" name="accidentes" min="0" max="99" placeholder="Ej: 0" required>
            <span class="field-hint">Cantidad de accidentes en los últimos años</span>
        </div>
    </div>
</body>
</html>
